name: ai-brain CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Schema, generation and privacy tests
        run: python -m unittest discover -s tests -v
      - name: PII / credential scan (boolean output only)
        run: python scripts/audit.py
      - name: Generated artifacts are deterministic and up to date
        run: python scripts/build.py --check
      - name: Consistency self-check
        run: python scripts/doctor.py
