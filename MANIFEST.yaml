schema_version: 1
content_version: "1.0.0"
generated_by: scripts/build.py
owner_role: ROLE-OWNER
sensitivity_default: local
budgets:
  ai_brief_tokens: 3000
  always_inject_tokens: 5000
  max_card_lines: 200
sources:
  - core
  - playbook
  - context
adapters:
  - agents
  - codebuddy
  - claude-code
  - cursor
  - gemini
  - copilot
  - chatgpt
private_bundle:
  path: private/workbuddy.bundle.enc
  encrypted: true
  passphrase_env: AI_BRAIN_PASSPHRASE
  restore_to: local/workbuddy
  note: 密文可入库；原文永不入库；口令永不落盘
